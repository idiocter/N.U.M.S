[project]
name = "nums-assistant"
version = "0.1.0"
description = "A private, local-first macOS assistant powered by Qwen through Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
nums = "nums.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nums"]
